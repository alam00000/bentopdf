services:
  pixelpdf:
    # GitHub Container Registry (Recommended)
    # Self-Hosted build - ghcr.io/mohammedalhinaki-cloud/pixel-pdf-simple:latest
    # Commercial build  - ghcr.io/mohammedalhinaki-cloud/pixel-pdf:latest
    # Docker Hub (Alternative)
    # Self-Hosted build - pixelpdfteam/pixelpdf-simple:latest
    # Commercial build  - pixelpdfteam/pixelpdf:latest
    image: ghcr.io/mohammedalhinaki-cloud/pixel-pdf-simple:latest
    container_name: pixelpdf
    restart: unless-stopped
    ports:
      - '8080:8080'
    # For IPv4-only environments
    #environment:
    #  - DISABLE_IPV6=true
