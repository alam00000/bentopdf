{{#if simpleMode}} {{> footer-simple}} {{else}}
<footer class="border-t border-white/10 py-12">
  <div class="container mx-auto px-4">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-8 text-center md:text-left">
      <div class="mb-8 md:mb-0">
        <div class="flex items-center justify-center md:justify-start mb-4">
          <img id="footer-logo" src="{{baseUrl}}{{#if brandLogo}}{{brandLogo}}{{else}}images/pixelpdf-icon.png{{/if}}" alt="{{#if brandName}}{{brandName}}{{else}}بيكسل  PDF{{/if}} - الشعار" class="h-10 w-10 mr-3">
          <span id="footer-brand" class="px-brand text-xl">{{#if brandName}}{{brandName}}{{else}}بيكسل <span class="px-brand-accent">PDF</span>{{/if}}</span>
        </div>
        <p id="footer-copyright" class="text-gray-400 text-sm" pixelhb16tokendata-i18n="footer.copyright" pixelhb17token="">
          {{#if footerText}}{{footerText}}{{else}}© 2026 Pixel PDF. جميع الحقوق محفوظة.{{/if}}
        </p>
        <p class="text-gray-400 text-xs mt-2">
          <span data-i18n="footer.version">الإصدار</span>
          <span id="app-version">{{appVersion}}</span>
        </p>
      </div>

      <div>
        <h3 class="font-bold text-white mb-4" data-i18n="footer.tools">الأدوات</h3>
        <ul class="space-y-2 text-gray-400">
          <li>
            <a href="/#tools-header" class="hover:text-indigo-400" data-i18n="nav.allTools">جميع الأدوات</a>
          </li>
          <li>
            <a href="/pdf-converter" class="hover:text-indigo-400" data-i18n="footer.pdfConverter">محول PDF</a>
          </li>
          <li>
            <a href="/pdf-security" class="hover:text-indigo-400" data-i18n="footer.pdfSecurity">أمان PDF</a>
          </li>
          <li>
            <a href="/pdf-merge-split" class="hover:text-indigo-400" data-i18n="footer.mergeSplit">دمج وتقسيم PDF</a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</footer>
{{/if}}
