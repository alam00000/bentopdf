{{#unless simpleMode}}
<footer
  class="flex-none border-t border-gray-700 bg-gray-800 px-3 sm:px-4 py-2 sm:py-2.5 text-[11px] sm:text-xs text-gray-500"
>
  <nav
    class="flex flex-wrap items-center justify-center sm:justify-start gap-x-3 sm:gap-x-4 gap-y-0.5"
    aria-label="روابط الموقع"
  >
    <a
      href="/"
      class="hidden sm:inline hover:text-gray-200"
      data-i18n="nav.home"
      >الرئيسية</a
    >
    <a href="/about" class="hover:text-gray-200" data-i18n="nav.about">حول</a>
    <a href="/licensing" class="hover:text-gray-200" data-i18n="nav.licensing"
      >الترخيص</a
    >
    <a href="/privacy" class="hover:text-gray-200"
      ><span class="sm:hidden" data-i18n="footer.privacyShort">الخصوصية</span
      ><span class="hidden sm:inline" data-i18n="footer.privacyPolicy"
        >سياسة الخصوصية</span
      ></a
    >
    <a href="/terms" class="hover:text-gray-200"
      ><span class="sm:hidden" data-i18n="footer.termsShort">الشروط</span
      ><span class="hidden sm:inline" data-i18n="footer.termsAndConditions"
        >الشروط والأحكام</span
      ></a
    >
    <a href="/contact" class="hover:text-gray-200" data-i18n="nav.contact"
      >اتصل بنا</a
    >
  </nav>
</footer>
{{/unless}}
