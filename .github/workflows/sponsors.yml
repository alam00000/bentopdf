name: Update Sponsors
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.repository == 'alam00000/bentopdf'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: JamesIves/github-sponsors-readme-action@02650b8cd445fc16dfef73195f9c406dce041623 # v1.6.1
        with:
          token: ${{ secrets.SPONSORS_TOKEN }}
          file: 'README.md'
          active-only: false
      - uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          commit-message: 'docs: update sponsors'
          title: 'docs: update sponsors'
          body: Updates the sponsors list in the README from GitHub Sponsors.
          branch: chore/update-sponsors
          delete-branch: true
